<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat IA - Agente com Memória</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Barra Lateral (Memória de Chats) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button id="nova" type="button">
          <span class="icone-mais">+</span> Nova conversa
        </button>
      </div>
      
      <div class="sidebar-titulo">Histórico na Memória</div>
      <div id="lista-conversas" class="lista-conversas">
        <!-- Os chats salvos serão renderizados aqui -->
      </div>
    </aside>

    <!-- Área Principal do Chat -->
    <main class="main-area">
      <header class="chat-header">
        <div class="header-info">
          <h1>Assistente Virtual</h1>
          <span class="badge-status"><span class="ponto-online"></span> Ollama Conectado</span>
        </div>
      </header>

      <div id="chat" aria-live="polite"></div>

      <div class="input-container">
        <form id="form">
          <input id="pergunta" aria-label="Sua mensagem" placeholder="Envie uma mensagem para a IA..." autocomplete="off" required>
          <button id="enviar" type="submit" title="Enviar mensagem">
            <span>Enviar</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
